<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 대시보드</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module">
        import { loginWithGoogle, logout, checkAuthState } from './js/auth.js';
        import { db, collection, query, where, getDocs, addDoc, doc, updateDoc, getDoc, deleteDoc } from './js/firebase-config.js';

        let currentUser = null;
        let currentView = 'card'; // 'card' or 'list'
        let currentFolderId = null; // null means root
        let currentFolderName = 'Home';
        let breadcrumbPath = [{ id: null, name: 'Home' }];
        let deleteMode = false;

        window.logoutUser = async () => {
            await logout();
            window.location.href = 'teacher.html';
        };

        window.toggleView = (view) => {
            currentView = view;
            document.getElementById('btnCardView').classList.toggle('active', view === 'card');
            document.getElementById('btnListView').classList.toggle('active', view === 'list');
            loadContent();
        };

        checkAuthState(async (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('userName').textContent = user.displayName;
                loadContent();
            } else {
                alert('로그인이 필요합니다.');
                window.location.href = 'teacher.html';
            }
        });

        async function loadContent() {
            const container = document.getElementById('quizList');
            container.innerHTML = '<div class="spinner"></div>';
            updateBreadcrumb();
            updateToolbar();

            try {
                // 1. Fetch Folders
                const folderQ = query(collection(db, "folders"), where("userId", "==", currentUser.uid), where("parentId", "==", currentFolderId));
                const folderSnap = await getDocs(folderQ);

                const folders = [];
                folderSnap.forEach(doc => folders.push({ id: doc.id, ...doc.data(), type: 'folder' }));

                // 2. Fetch Quizzes
                const quizQ = query(collection(db, "quizzes"), where("userId", "==", currentUser.uid));
                const quizSnap = await getDocs(quizQ);

                const quizzes = [];
                quizSnap.forEach(doc => {
                    const data = doc.data();
                    if (currentFolderId === null) {
                        if (!data.folderId) quizzes.push({ id: doc.id, ...data, type: 'quiz' });
                    } else {
                        if (data.folderId === currentFolderId) quizzes.push({ id: doc.id, ...data, type: 'quiz' });
                    }
                });

                folders.sort((a, b) => a.name.localeCompare(b.name));
                quizzes.sort((a, b) => b.createdAt.seconds - a.createdAt.seconds);

                const items = [...folders, ...quizzes];

                container.innerHTML = '';

                if (items.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#999;">이 폴더에는 항목이 없습니다.</p>';
                    return;
                }

                if (currentView === 'card') {
                    container.className = 'grid-container';
                    items.forEach(item => {
                        const div = document.createElement('div');

                        if (item.type === 'folder') {
                            div.className = 'card quiz-card folder-card' + (deleteMode ? ' delete-mode' : '');
                            div.dataset.id = item.id;
                            div.dataset.type = 'folder';
                            div.dataset.name = (item.name || '').replace(/"/g, '&quot;');
                            if (deleteMode) {
                                div.innerHTML = `
                                    <label class="delete-check-wrap" onclick="event.stopPropagation()">
                                        <input type="checkbox" class="delete-check" data-id="${item.id}" data-type="folder">
                                    </label>
                                    <div class="folder-icon">📁</div>
                                    <h3>${item.name}</h3>
                                `;
                                div.onclick = () => div.querySelector('.delete-check').click();
                            } else {
                                div.onclick = () => enterFolder(item.id, item.name);
                                div.innerHTML = `
                                    <div class="folder-icon">📁</div>
                                    <h3>${item.name}</h3>
                                `;
                            }
                        } else {
                            div.className = 'card quiz-card' + (deleteMode ? ' delete-mode' : '');
                            div.dataset.id = item.id;
                            div.dataset.type = 'quiz';
                            const safeTitle = (item.title || '').replace(/"/g, '&quot;').replace(/'/g, "\\'");
                            if (deleteMode) {
                                div.innerHTML = `
                                    <label class="delete-check-wrap" onclick="event.stopPropagation()">
                                        <input type="checkbox" class="delete-check" data-id="${item.id}" data-type="quiz">
                                    </label>
                                    <div class="card-icon">📝</div>
                                    <h3>${item.title}</h3>
                                `;
                                div.onclick = () => div.querySelector('.delete-check').click();
                            } else {
                                div.oncontextmenu = (e) => showContextMenu(e, item.id);
                                div.onclick = () => showResults(item.id, item.title);
                                div.innerHTML = `
                                    <div class="card-icon">📝</div>
                                    <h3>${item.title}</h3>
                                `;
                            }
                        }
                        container.appendChild(div);
                    });
                } else {
                    container.className = '';
                    const table = document.createElement('table');
                    const thCheck = deleteMode ? '<th style="width:2.5rem;"><input type="checkbox" id="selectAllList" onclick="toggleSelectAllList()" title="전체 선택"></th>' : '';
                    table.innerHTML = `
                        <thead>
                            <tr>
                                ${thCheck}
                                <th>유형</th>
                                <th>이름</th>
                                <th>생성일</th>
                                ${deleteMode ? '' : '<th>관리</th>'}
                            </tr>
                        </thead>
                        <tbody></tbody>
                    `;
                    const tbody = table.querySelector('tbody');
                    items.forEach(item => {
                        const tr = document.createElement('tr');
                        const checkCell = deleteMode ? `<td><input type="checkbox" class="delete-check" data-id="${item.id}" data-type="${item.type}"></td>` : '';
                        if (item.type === 'folder') {
                            tr.innerHTML = checkCell + `
                                <td>📁</td>
                                <td style="cursor:pointer; font-weight:bold;" onclick="enterFolder('${item.id}', '${item.name}')">${item.name}</td>
                                <td>-</td>
                                ${deleteMode ? '' : '<td>-</td>'}
                            `;
                        } else {
                            const date = item.createdAt.toDate().toLocaleDateString();
                            const safeTitle = item.title.replace(/'/g, "\\'");
                            tr.innerHTML = checkCell + `
                                <td>📝</td>
                                <td>${item.title}</td>
                                <td>${date}</td>
                                ${deleteMode ? '' : `<td>
                                    <button class="btn btn-sm" onclick="showResults('${item.id}', '${safeTitle}')">결과</button>
                                    <button class="btn btn-sm btn-secondary" onclick="openMoveQuizModal('${item.id}')">이동</button>
                                </td>`}
                            `;
                        }
                        tbody.appendChild(tr);
                    });
                    container.appendChild(table);
                }

            } catch (e) {
                console.error(e);
                container.innerHTML = `<p style="color:red;">오류 발생: ${e.message}</p>`;
            }
        }

        window.enterFolder = (id, name) => {
            currentFolderId = id;
            currentFolderName = name;
            breadcrumbPath.push({ id, name });
            loadContent();
        };

        window.navigateTo = (index) => {
            breadcrumbPath = breadcrumbPath.slice(0, index + 1);
            const target = breadcrumbPath[index];
            currentFolderId = target.id;
            currentFolderName = target.name;
            loadContent();
        };

        function updateBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            breadcrumb.innerHTML = '';
            breadcrumbPath.forEach((item, index) => {
                const span = document.createElement('span');
                span.className = 'breadcrumb-item';
                span.textContent = item.name;
                span.onclick = () => navigateTo(index);
                breadcrumb.appendChild(span);

                if (index < breadcrumbPath.length - 1) {
                    const sep = document.createElement('span');
                    sep.className = 'breadcrumb-separator';
                    sep.textContent = ' > ';
                    breadcrumb.appendChild(sep);
                }
            });
        }

        function updateToolbar() {
            const importBtn = document.getElementById('btnImport');
            if (currentFolderId === null) {
                importBtn.style.display = 'none';
            } else {
                importBtn.style.display = 'inline-block';
            }
            const btnCreateFolder = document.getElementById('btnCreateFolder');
            const btnDelete = document.getElementById('btnDelete');
            const deleteActions = document.getElementById('deleteActions');
            if (deleteMode) {
                if (btnCreateFolder) btnCreateFolder.style.display = 'none';
                if (btnDelete) btnDelete.style.display = 'none';
                if (deleteActions) deleteActions.style.display = 'inline-flex';
            } else {
                if (btnCreateFolder) btnCreateFolder.style.display = 'inline-block';
                if (btnDelete) btnDelete.style.display = 'inline-block';
                if (deleteActions) deleteActions.style.display = 'none';
            }
        }

        window.enterDeleteMode = () => {
            deleteMode = true;
            updateToolbar();
            loadContent();
        };

        window.cancelDeleteMode = () => {
            deleteMode = false;
            updateToolbar();
            loadContent();
        };

        window.toggleSelectAllList = () => {
            const all = document.getElementById('selectAllList');
            if (!all) return;
            document.querySelectorAll('.delete-check').forEach(cb => { cb.checked = all.checked; });
        };

        window.deleteSelected = async () => {
            const checked = document.querySelectorAll('.delete-check:checked');
            if (checked.length === 0) {
                alert('삭제할 항목을 선택해 주세요.');
                return;
            }
            const folders = [];
            const quizzes = [];
            checked.forEach(el => {
                if (el.dataset.type === 'folder') folders.push(el.dataset.id);
                else quizzes.push(el.dataset.id);
            });
            const msg = `선택한 항목을 삭제합니다.\n폴더 ${folders.length}개, 문제 ${quizzes.length}개\n계속할까요?`;
            if (!confirm(msg)) return;

            try {
                for (const folderId of folders) {
                    const subFolderQ = query(collection(db, "folders"), where("parentId", "==", folderId));
                    const subSnap = await getDocs(subFolderQ);
                    for (const d of subSnap.docs) {
                        await updateDoc(doc(db, "folders", d.id), { parentId: currentFolderId });
                    }
                    const quizInFolderQ = query(collection(db, "quizzes"), where("folderId", "==", folderId));
                    const quizSnap = await getDocs(quizInFolderQ);
                    for (const d of quizSnap.docs) {
                        await updateDoc(doc(db, "quizzes", d.id), { folderId: null });
                    }
                    await deleteDoc(doc(db, "folders", folderId));
                }
                for (const quizId of quizzes) {
                    await deleteDoc(doc(db, "quizzes", quizId));
                }
                deleteMode = false;
                updateToolbar();
                loadContent();
            } catch (e) {
                console.error(e);
                alert('삭제 중 오류: ' + e.message);
            }
        };

        window.createFolder = async () => {
            const name = prompt("새 폴더 이름을 입력하세요:");
            if (!name) return;

            try {
                await addDoc(collection(db, "folders"), {
                    userId: currentUser.uid,
                    name: name,
                    parentId: currentFolderId,
                    createdAt: new Date()
                });
                loadContent();
            } catch (e) {
                alert("폴더 생성 실패: " + e.message);
            }
        };

        // Context Menu Logic
        let selectedQuizId = null;

        window.showContextMenu = (e, quizId) => {
            e.preventDefault();
            selectedQuizId = quizId;
            const menu = document.getElementById('contextMenu');
            menu.style.display = 'block';
            menu.style.left = `${e.pageX}px`;
            menu.style.top = `${e.pageY}px`;
        };

        window.onclick = (e) => {
            document.getElementById('contextMenu').style.display = 'none';
            if (e.target == document.getElementById('resultModal')) {
                document.getElementById('resultModal').style.display = 'none';
            }
            if (e.target == document.getElementById('addQuizModal')) {
                document.getElementById('addQuizModal').style.display = 'none';
            }
            if (e.target == document.getElementById('moveQuizModal')) {
                document.getElementById('moveQuizModal').style.display = 'none';
            }
        };

        // Move Quiz Modal Logic
        window.openMoveQuizModal = async (quizId = selectedQuizId) => {
            selectedQuizId = quizId; // Ensure selectedQuizId is set
            const modal = document.getElementById('moveQuizModal');
            const select = document.getElementById('moveFolderSelect');

            modal.style.display = 'flex';
            select.innerHTML = '<option>로딩 중...</option>';

            const folders = await fetchAllFolders();
            select.innerHTML = '<option value="root">최상위 (Root)</option>';

            folders.forEach(f => {
                // Don't show current folder if possible, but simple is fine
                const option = document.createElement('option');
                option.value = f.id;
                option.textContent = f.name;
                select.appendChild(option);
            });
        };

        window.confirmMoveQuiz = async () => {
            const select = document.getElementById('moveFolderSelect');
            const targetId = select.value === 'root' ? null : select.value;

            try {
                await updateDoc(doc(db, "quizzes", selectedQuizId), {
                    folderId: targetId
                });
                document.getElementById('moveQuizModal').style.display = 'none';
                loadContent();
            } catch (e) {
                alert("이동 실패: " + e.message);
            }
        };

        async function fetchAllFolders() {
            const q = query(collection(db, "folders"), where("userId", "==", currentUser.uid));
            const snap = await getDocs(q);
            const folders = [];
            snap.forEach(doc => folders.push({ id: doc.id, ...doc.data() }));
            return folders;
        }

        // Add Quiz to Folder (from within folder)
        window.openAddQuizModal = async () => {
            if (currentFolderId === null) return alert("폴더 내부에서만 사용할 수 있습니다.");

            const modal = document.getElementById('addQuizModal');
            const list = document.getElementById('addQuizList');
            modal.style.display = 'flex';
            list.innerHTML = '<div class="spinner"></div>';

            const q = query(collection(db, "quizzes"), where("userId", "==", currentUser.uid));
            const snap = await getDocs(q);

            list.innerHTML = '';
            let count = 0;
            snap.forEach(doc => {
                const data = doc.data();
                if (!data.folderId) { // Only show root quizzes
                    count++;
                    const div = document.createElement('div');
                    div.style.padding = '0.8rem';
                    div.style.borderBottom = '1px solid #eee';
                    div.style.display = 'flex';
                    div.style.justifyContent = 'space-between';
                    div.style.alignItems = 'center';
                    div.innerHTML = `
                        <span>${data.title}</span>
                        <button class="btn btn-sm" onclick="moveQuizToCurrent('${doc.id}')">추가</button>
                    `;
                    list.appendChild(div);
                }
            });

            if (count === 0) list.innerHTML = '<p style="text-align:center; color:#666;">추가할 수 있는 자료가 없습니다 (모두 분류됨).</p>';
        };

        window.moveQuizToCurrent = async (quizId) => {
            try {
                await updateDoc(doc(db, "quizzes", quizId), {
                    folderId: currentFolderId
                });
                openAddQuizModal(); // Refresh list
                loadContent(); // Refresh background
            } catch (e) {
                alert("추가 실패: " + e.message);
            }
        };

        window.closeAddQuizModal = () => {
            document.getElementById('addQuizModal').style.display = 'none';
        };

        window.closeMoveQuizModal = () => {
            document.getElementById('moveQuizModal').style.display = 'none';
        };

        // Existing Result Logic
        window.showResults = async (quizId, title) => {
            const modal = document.getElementById('resultModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.textContent = `'${title}' 참여 현황`;
            modalBody.innerHTML = '<div class="spinner"></div>';
            modal.style.display = 'flex';

            console.log("Searching results for Firestore Quiz ID:", quizId);

            try {
                const q = query(collection(db, "results"), where("firestoreId", "==", quizId));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    modalBody.innerHTML = `
                        <p>참여한 학생이 없습니다.</p>
                        <p style="font-size:0.8rem; color:#999;">Debug: Quiz ID ${quizId}</p>
                        <p style="font-size:0.9rem; color:#666;">
                            * 참고: 최근 업데이트 이전에 생성된 퀴즈 링크로 참여한 경우, 결과가 여기에 표시되지 않을 수 있습니다.<br>
                            새로 퀴즈를 생성하여 테스트해주세요.
                        </p>
                    `;
                    return;
                }

                const results = [];
                querySnapshot.forEach(doc => {
                    results.push(doc.data());
                });
                results.sort((a, b) => b.submittedAt.seconds - a.submittedAt.seconds);

                let html = `
                    <table class="result-table">
                        <thead>
                            <tr>
                                <th>이름</th>
                                <th>점수</th>
                                <th>정답률</th>
                                <th>소요시간</th>
                                <th>제출일시</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                results.forEach(r => {
                    const time = r.submittedAt.toDate().toLocaleString();
                    html += `
                        <tr>
                            <td>${r.studentName}</td>
                            <td>${r.score} / ${r.total}</td>
                            <td>${r.accuracy}%</td>
                            <td>${r.timeTaken}</td>
                            <td>${time}</td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                modalBody.innerHTML = html;

            } catch (e) {
                console.error(e);
                modalBody.innerHTML = `<p style="color:red;">결과를 불러오는 중 오류가 발생했습니다.<br>${e.message}</p>`;
            }
        };

        window.closeModal = () => {
            document.getElementById('resultModal').style.display = 'none';
        };
    </script>
</head>

<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h1>대시보드</h1>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <span id="userName" style="margin-right: 0.5rem; font-weight: bold;"></span>
                <button class="btn btn-secondary" onclick="logoutUser()"
                    style="width: auto; padding: 0.5rem 1rem; margin: 0;">로그아웃</button>
                <a href="teacher.html" class="btn" style="width: auto; padding: 0.5rem 1rem; margin: 0;">새 퀴즈 만들기</a>
            </div>
        </header>

        <div class="toolbar">
            <div id="breadcrumb" class="breadcrumb">
                <!-- Breadcrumbs -->
            </div>
            <div class="toolbar-actions">
                <button class="btn btn-sm" id="btnCreateFolder" onclick="createFolder()">+ 폴더 생성</button>
                <button class="btn btn-sm btn-secondary" id="btnDelete" onclick="enterDeleteMode()">삭제</button>
                <div id="deleteActions" style="display:none; align-items:center; gap:0.4rem;">
                    <button class="btn btn-sm" onclick="deleteSelected()">선택 항목 삭제</button>
                    <button class="btn btn-sm btn-secondary" onclick="cancelDeleteMode()">취소</button>
                </div>
                <button class="btn btn-sm" id="btnImport" onclick="openAddQuizModal()">+ 자료 가져오기</button>
                <div style="display:inline-flex; gap:0.2rem; margin-left:0.5rem;">
                    <button class="toggle-btn active" id="btnCardView" onclick="toggleView('card')">카드</button>
                    <button class="toggle-btn" id="btnListView" onclick="toggleView('list')">목록</button>
                </div>
            </div>
        </div>

        <div id="quizList">
            <!-- Content will be loaded here -->
        </div>
    </div>

    <!-- Result Modal (학습 결과 - 넓은 가독성) -->
    <div id="resultModal" class="modal">
        <div class="modal-content result-modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">참여 현황</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Add Quiz Modal -->
    <div id="addQuizModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <span class="close-btn" onclick="closeAddQuizModal()">&times;</span>
            <h2>자료 가져오기</h2>
            <p>분류되지 않은 자료를 현재 폴더로 가져옵니다.</p>
            <div id="addQuizList" style="max-height: 400px; overflow-y: auto; margin-top: 1rem;"></div>
        </div>
    </div>

    <!-- Move Quiz Modal -->
    <div id="moveQuizModal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close-btn" onclick="closeMoveQuizModal()">&times;</span>
            <h2>폴더로 이동</h2>
            <p>이동할 폴더를 선택하세요.</p>
            <select id="moveFolderSelect" style="margin-top:1rem;"></select>
            <button class="btn" onclick="confirmMoveQuiz()" style="margin-top:1rem;">이동하기</button>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item" onclick="openMoveQuizModal()">폴더로 이동...</div>
    </div>
</body>

</html>
